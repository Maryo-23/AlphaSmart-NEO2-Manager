name: Build Mac DMG

on:
  workflow_dispatch:
  push:
    tags:
      - "mac-v*"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runs-on: macos-13, arch: x86_64 }
          - { runs-on: macos-14, arch: arm64 }
    runs-on: ${{ matrix.runs-on }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install pyinstaller neotools libusb1

      - name: Download pandoc (latest release)
        run: |
          TAG=$(curl -s https://api.github.com/repos/jgm/pandoc/releases/latest | jq -r .tag_name)
          curl -sL -o pandoc.zip "https://github.com/jgm/pandoc/releases/download/${TAG}/pandoc-${TAG}-${{ matrix.arch }}-macOS.zip"
          unzip -q -o pandoc.zip
          PANDOC_BIN=$(find . -name pandoc -type f | head -1)
          cp "$PANDOC_BIN" pandoc-bin
          chmod +x pandoc-bin

      - name: Build NEO Sender.app
        run: pyinstaller --noconfirm --windowed --name "NEO Sender" mac/neo-sender-gui

      - name: Build helper binaries
        run: |
          pyinstaller --noconfirm --onefile --name neotools-cli mac/neotools_cli.py
          pyinstaller --noconfirm --onefile --name neo-format-neo2 mac/neo-format-neo2

      - name: Bundle helpers into the app
        run: cp dist/neotools-cli dist/neo-format-neo2 pandoc-bin "dist/NEO Sender.app/Contents/MacOS/"

      - name: Create DMG
        run: |
          brew install create-dmg
          create-dmg --volname "NEO2 Mac Manager" "NEO2-Mac-Manager-${{ matrix.arch }}.dmg" "dist/NEO Sender.app" || \
          hdiutil create -volname "NEO2 Mac Manager" -srcfolder "dist/NEO Sender.app" -ov -format UDZO "NEO2-Mac-Manager-${{ matrix.arch }}.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: NEO2-Mac-Manager-${{ matrix.arch }}
          path: "NEO2-Mac-Manager-${{ matrix.arch }}.dmg"

      - name: Attach DMG to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: "NEO2-Mac-Manager-${{ matrix.arch }}.dmg"
